<!doctype html>
<html lang="ko" data-lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>[[title_ko]]</title>
<meta name="description" content="[[excerpt_ko]]">
<link rel="canonical" href="[[canonical]]">
<script>
/* 첫 화면을 그리기 전에 언어와 테마를 정한다. 블로그의 report 레이아웃이 같은 키를 미리 써 둔다. */
(function(){
  var r=document.documentElement, q=null, l=null, t=null;
  try{q=new URLSearchParams(location.search).get('lang')}catch(e){}
  try{l=localStorage.getItem('techblogs-lang');t=localStorage.getItem('techblogs-theme')}catch(e){}
  var lang=(q==='en'||q==='ko')?q:(l==='en'?'en':'ko');
  r.setAttribute('data-lang',lang); r.setAttribute('lang',lang);
  if(t==='dark'||t==='light')r.setAttribute('data-theme',t);
})();
</script>
<style>
/* 글꼴: 설치된 나눔스퀘어와 D2Coding을 먼저 쓰고, 없으면 블로그의 /assets/fonts/ 파일을 받는다. */
@font-face{font-family:"NanumSquareOTF_ac";src:local("NanumSquareOTF_acR"),local("NanumSquareOTF_ac Regular"),local("NanumSquare_acR"),url("/assets/fonts/NanumSquare_acR.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"NanumSquareOTF_ac";src:local("NanumSquareOTF_acB"),local("NanumSquareOTF_ac Bold"),local("NanumSquare_acB"),url("/assets/fonts/NanumSquare_acB.woff2") format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"D2Coding";src:local("D2Coding"),url("/assets/fonts/D2Coding.woff2") format("woff2");font-weight:400;font-display:swap}
/* 디자인: 한 컬럼. .wrap은 좌우 여백을 포함해 최대 1440px이고 가운데에 놓인다. 본문, 그림, 표가 모두 같은 폭을 쓴다. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --ink:#15202b; --muted:#5a6774; --line:#d9e0e7; --soft:#eaf0f7; --code:#eef2f6;
  --accent:#1d5bb8;
  --good:#1b7a4a; --warn:#946000; --bad:#bf3a30;
  --good-bg:#e4f2ea; --warn-bg:#f7eedb; --bad-bg:#f8e5e3;
  --f-display:"NanumSquareOTF_ac","NanumSquare_ac","NanumSquare","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"NanumSquareOTF_ac","NanumSquare_ac","NanumSquare","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-data:"NanumSquareOTF_ac","NanumSquare_ac","NanumSquare","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"D2Coding","SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1319; --surface:#151c24; --ink:#e4e9ef; --muted:#98a4b0; --line:#2a3541; --soft:#1b2631; --code:#1d2732;
    --accent:#86abff;
    --good:#5cc790; --warn:#e2aa48; --bad:#f17d73;
    --good-bg:#15291e; --warn-bg:#2c2413; --bad-bg:#2f1b19;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1319; --surface:#151c24; --ink:#e4e9ef; --muted:#98a4b0; --line:#2a3541; --soft:#1b2631; --code:#1d2732;
  --accent:#86abff;
  --good:#5cc790; --warn:#e2aa48; --bad:#f17d73;
  --good-bg:#15291e; --warn-bg:#2c2413; --bad-bg:#2f1b19;
  color-scheme:dark;
}

*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;word-break:keep-all;overflow-wrap:break-word}
a{color:var(--accent);text-decoration:none;text-underline-offset:3px}
a:hover{text-decoration:underline}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
.num,.mono{font-family:var(--f-data);font-variant-numeric:tabular-nums}

.wrap{width:100%;max-width:1440px;margin:0 auto;padding-left:max(clamp(16px,4vw,64px),env(safe-area-inset-left,0px));padding-right:max(clamp(16px,4vw,64px),env(safe-area-inset-right,0px));padding-block:24px 72px;display:grid;grid-template-columns:minmax(0,1fr);gap:56px}
.wrap>*{min-width:0}

/* 상단 막대: 목록 링크와 언어, 테마 전환. 블로그에 임베드되면 레이아웃이 .theme-bar를 숨긴다. */
nav.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
nav.top .home{font-size:12.5px;font-weight:700;letter-spacing:.04em;color:var(--muted)}
.tog{display:flex;gap:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{font:inherit;font-size:12.5px;padding:3px 10px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* 머리 */
.masthead{display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
.meta-top{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:12.5px;color:var(--muted);letter-spacing:.04em}
.meta-top span{white-space:nowrap}
.meta-top .wide,.meta-top .wide span{white-space:normal}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(30px,5vw,44px);line-height:1.2;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1.one{white-space:nowrap}
.thesis{font-size:17px;line-height:1.75;margin:0}
.tags{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}

/* 핵심 요점: 상자 없이 목록으로 */
.facts{margin:0;padding-left:20px;display:grid;gap:4px;font-size:14.5px;line-height:1.6;color:var(--ink)}
.facts li::marker{color:var(--muted)}
.facts b{font-weight:700;color:var(--ink)}

/* 절 */
.col{display:grid;gap:56px;min-width:0}
.sec{display:grid;gap:20px;min-width:0}
.sec-head{display:grid;gap:6px;padding-top:20px;border-top:2px solid var(--ink)}
.eyebrow{margin:0;font-family:var(--f-data);font-size:12px;letter-spacing:.04em;color:var(--muted)}
h2{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.3;margin:0;text-wrap:balance}
.lede{margin:0;color:var(--muted);font-size:13.5px}

/* 본문: 그림과 표도 같은 폭 */
.prose{min-width:0}
.prose>*{margin:0}
.prose>*+*{margin-top:14px}
.prose h3{font-size:17px;font-weight:700;margin-top:30px;letter-spacing:-.005em}
.prose h3+*{margin-top:10px}
.prose ul,.prose ol{padding-left:22px}
.prose li+li{margin-top:6px}
.prose blockquote{background:var(--soft);border-radius:10px;padding:14px 18px}
.prose blockquote p{margin:0}
.prose blockquote p+p{margin-top:6px}
.prose>figure.fig,.prose>.scroll,.prose>pre,.prose>.snippet{margin-top:20px}
.prose>figure.fig+*,.prose>.scroll+*,.prose>pre+*,.prose>.snippet+*{margin-top:20px}
code{font-family:var(--f-mono);font-size:.88em;background:var(--code);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
pre{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;overflow-x:auto;line-height:1.5}
pre code{background:none;padding:0;font-size:13px;overflow-wrap:normal}
/* 코드 스니펫: 언어 이름과 복사 버튼이 있는 상자 */
.snippet{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden;min-width:0}
.snippet-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px 6px 14px;background:var(--soft);border-bottom:1px solid var(--line)}
.snippet-bar .lang{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.snippet pre{margin:0;border:0;border-radius:0;background:transparent}
button.copy{font:inherit;font-size:12px;line-height:1.4;padding:3px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);cursor:pointer}
button.copy:hover{border-color:var(--accent);color:var(--accent)}
button.copy .ok{display:none}
button.copy.done .ok{display:inline}
button.copy.done .i{display:none}
button.copy.done{border-color:var(--good);color:var(--good)}
sup.cite{font-size:.68em;line-height:0;margin-left:1px}
sup.cite a{font-weight:700}

/* 표 */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px;line-height:1.55}
th,td{padding:10px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{font-size:12px;font-weight:600;color:var(--muted);background:var(--soft);white-space:nowrap}
td.nowrap,.nowrap{white-space:nowrap}
.cap{margin:0;font-size:13px;color:var(--muted)}
.cap b{color:var(--ink);font-weight:700}
.prose>.scroll+.cap{margin-top:10px}

/* 그림: 본문과 같은 폭의 패널 안에 둔다. 다이어그램은 흰 바탕으로 그리므로 다크 테마에서도 캔버스는 흰색이다. */
figure.fig{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 20px 14px;min-width:0}
figure.fig .canvas{background:#ffffff;border-radius:6px;overflow-x:auto;-webkit-overflow-scrolling:touch}
figure.fig img{display:block;max-width:100%;height:auto;margin:0 auto}
figure.fig .canvas.wide img{width:100%;max-width:1280px}
figure.fig figcaption{font-size:13px;color:var(--muted);margin-top:10px}
figure.fig figcaption b{color:var(--ink);font-weight:700}

/* 참고 자료 표 */
.src-t td.t{min-width:240px}
.src-t .meta{font-size:12.5px;color:var(--muted)}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap;line-height:1.6}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--soft);color:var(--muted)}

/* 끝: 글쓴이와 고지 */
.foot{font-size:13px;color:var(--muted);display:grid;gap:10px;border-top:1px solid var(--line);padding-top:20px}
.foot h2{font-size:18px;color:var(--ink)}
.foot p{margin:0;line-height:1.75}
.foot ul{margin:0;padding-left:20px;line-height:1.75}
.foot b{color:var(--ink);font-weight:600}
.colophon{margin:-32px 0 0;font-size:12.5px;color:var(--muted)}

/* 이동 메뉴: 머리 아래에 두고, 문서만 열었을 때는 스크롤해도 화면 위쪽에 붙어 있다 */
nav.toc{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:6px;margin:-28px 0 -28px;padding:10px 0;overflow-x:auto;white-space:nowrap;background:var(--bg);border-bottom:1px solid var(--line);scrollbar-width:thin}
nav.toc .toc-label{flex:none;margin-right:4px;font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--muted)}
nav.toc a{flex:none;font-size:12.5px;line-height:1.4;color:var(--ink);text-decoration:none;padding:4px 11px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
nav.toc a:hover{border-color:var(--accent);color:var(--accent)}
nav.toc a.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.sec{scroll-margin-top:68px}

html[data-lang="ko"] .l-en{display:none!important}
html[data-lang="en"] .l-ko{display:none!important}

@media (max-width:640px){
  .wrap{padding-block:20px 56px;gap:44px}
  h2{font-size:22px}
  .thesis{font-size:16px}
  figure.fig{padding:12px 12px 10px}
  figure.fig .canvas.wide img{width:760px;max-width:none}
  figure.fig .canvas.wide+figcaption::after{content:" (가로로 밀어서 보기)"}
  html[data-lang="en"] figure.fig .canvas.wide+figcaption::after{content:" (scroll sideways)"}
}
@media print{
  nav.top,nav.toc,button.copy{display:none}
  .wrap{max-width:none;padding:0;gap:36px}
  .sec,figure.fig,.scroll,.snippet{break-inside:avoid-page}
  .sec{break-inside:auto}
}
</style>
</head>
<body>
<div class="wrap page">
<nav class="top theme-bar">
  <a class="home" href="[[home_url]]"><span class="l-ko">[[home_ko]]</span><span class="l-en">[[home_en]]</span></a>
  <div class="tog">
    <div class="seg" id="langSeg"><button type="button" data-v="ko">한국어</button><button type="button" data-v="en">English</button></div>
    <div class="seg" id="themeSeg"><button type="button" data-v="light">Light</button><button type="button" data-v="dark">Dark</button></div>
  </div>
</nav>
<header class="masthead">
<div class="meta-top">[[meta_top]]</div>
<h1><span class="l-ko">[[title_ko]]</span><span class="l-en">[[title_en]]</span></h1>
<p class="thesis"><span class="l-ko">[[thesis_ko]]</span><span class="l-en">[[thesis_en]]</span></p>
<div class="tags">[[tags]]</div>
[[facts]]
</header>
<nav class="toc l-ko" aria-label="목차"><span class="toc-label">목차</span>[[toc_ko]]</nav>
<nav class="toc l-en" aria-label="Contents"><span class="toc-label">Contents</span>[[toc_en]]</nav>
<div class="col l-ko" lang="ko">
[[body_ko]]
</div>
<div class="col l-en" lang="en">
[[body_en]]
</div>
[[sources]]
<footer class="foot">
[[foot]]
</footer>
[[colophon]]
</div>
<script>
(function(){
  var root=document.documentElement;
  function get(k){try{return localStorage.getItem(k)}catch(e){return null}}
  function put(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function mark(id,v){var bs=document.querySelectorAll('#'+id+' button');for(var i=0;i<bs.length;i++){bs[i].setAttribute('aria-pressed',bs[i].getAttribute('data-v')===v?'true':'false')}}
  function curTheme(){var t=root.getAttribute('data-theme');if(t==='dark'||t==='light')return t;return (window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light'}
  window.setLang=function(v){v=(v==='en')?'en':'ko';root.setAttribute('data-lang',v);root.setAttribute('lang',v);mark('langSeg',v);put('techblogs-lang',v)};
  window.setTheme=function(v){v=(v==='dark')?'dark':'light';root.setAttribute('data-theme',v);mark('themeSeg',v);put('techblogs-theme',v)};
  mark('langSeg',root.getAttribute('data-lang')==='en'?'en':'ko'); mark('themeSeg',curTheme());
  document.getElementById('langSeg').addEventListener('click',function(e){var v=e.target.getAttribute('data-v');if(v)setLang(v)});
  document.getElementById('themeSeg').addEventListener('click',function(e){var v=e.target.getAttribute('data-v');if(v)setTheme(v)});
  /* 블로그 레이아웃이 속성을 직접 바꾸고 이벤트를 보낸다. 버튼 표시와 lang 속성을 맞춘다. */
  document.addEventListener('langchange',function(){var v=root.getAttribute('data-lang')==='en'?'en':'ko';root.setAttribute('lang',v);mark('langSeg',v)});
  document.addEventListener('themechange',function(){mark('themeSeg',curTheme())});
  /* 제목 맞춤: 보이는 언어의 제목이 한 줄에 들어갈 때까지 글자 크기를 줄인다. 30px에서도 넘치면 30px로 두고 줄을 바꾼다 */
  (function(){var h=document.querySelector('h1');if(!h)return;var MIN=30,raf=0;
    function fitTitle(){h.style.fontSize='';h.classList.remove('one');
      var s=h.querySelector(root.getAttribute('data-lang')==='en'?'.l-en':'.l-ko');if(!s)return;
      var base=parseFloat(getComputedStyle(h).fontSize),avail=h.getBoundingClientRect().width;if(avail<=0||base<=MIN)return;
      function wide(){return s.getBoundingClientRect().width>avail}
      h.classList.add('one');
      if(!wide()){h.classList.remove('one');return}
      var size=Math.max(MIN,Math.floor(base*avail/s.getBoundingClientRect().width*2)/2);
      h.style.fontSize=size+'px';
      while(size>MIN&&wide()){size-=.5;h.style.fontSize=size+'px'}
      if(wide())h.classList.remove('one')}
    function later(){cancelAnimationFrame(raf);raf=requestAnimationFrame(fitTitle)}
    fitTitle();window.addEventListener('resize',later);
    if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitTitle);
    if('MutationObserver' in window)new MutationObserver(later).observe(root,{attributes:true,attributeFilter:['data-lang']});
  })();
  /* 이동 메뉴: 지금 보이는 절의 링크를 표시하고 메뉴 안에서 그 링크가 보이게 옮긴다 */
  (function(){var navs=document.querySelectorAll('nav.toc');if(!navs.length||!('IntersectionObserver' in window))return;
    var links={};for(var n=0;n<navs.length;n++){var as=navs[n].querySelectorAll('a');for(var j=0;j<as.length;j++){var id=as[j].getAttribute('href').slice(1);(links[id]=links[id]||[]).push(as[j])}}
    var io=new IntersectionObserver(function(es){for(var k=0;k<es.length;k++){if(!es[k].isIntersecting)continue;var ls=links[es[k].target.id]||[];if(!ls.length)continue;
      for(var m=0;m<navs.length;m++){var on=navs[m].querySelectorAll('a.on');for(var q=0;q<on.length;q++)on[q].classList.remove('on')}
      for(var r=0;r<ls.length;r++){ls[r].classList.add('on');var p=ls[r].parentNode;p.scrollLeft=Math.max(0,ls[r].offsetLeft-p.clientWidth/3)}}},{rootMargin:'-72px 0px -65% 0px'});
    for(var id2 in links){var el=document.getElementById(id2);if(el)io.observe(el)}})();
  function fallbackCopy(t){var a=document.createElement('textarea');a.value=t;a.setAttribute('readonly','');a.style.position='fixed';a.style.top='-1000px';document.body.appendChild(a);a.select();var ok=false;try{ok=document.execCommand('copy')}catch(x){}document.body.removeChild(a);return ok}
  function markCopy(b,ok){b.setAttribute('data-copied',ok?'1':'0');if(!ok)return;b.classList.add('done');clearTimeout(b._t);b._t=setTimeout(function(){b.classList.remove('done')},1600)}
  document.addEventListener('click',function(e){var b=e.target.closest?e.target.closest('button.copy'):null;if(!b)return;
    var pre=b.closest('.snippet').querySelector('pre');var txt=pre.innerText.replace(/\n$/,'');
    if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(function(){markCopy(b,true)},function(){markCopy(b,fallbackCopy(txt))})}
    else{markCopy(b,fallbackCopy(txt))}});
})();
</script>
</body>
</html>
