# Every second week: rebuild aws-diagram-design from cathrynlavery/diagram-design by its recipe
# (scripts/upstream-skills.json, the skills whose `schedule` is biweekly; the recipe is
# scripts/upstream/aws-diagram-design/recipe.json).
# When the source changed and the recipe still applies, the rebuilt skill goes to the branch
# sync/aws-diagram-design and a pull request asks for a review (an issue with the link when Actions may
# not open pull requests). When the recipe no longer applies, nothing is written and an issue carries
# the reason. Nothing is merged or released here, and no file of the source is ever run.
name: Sync aws-diagram-design

on:
  schedule:
    - cron: "47 21 * * 0" # Monday 06:47 in Seoul; the first step lets every second week through
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: sync-aws-diagram-design
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Every second week
        id: due
        run: |
          # Whole weeks since 1970-01-01, a Thursday: the count changes on Thursdays, so a Monday run
          # sees it alternate. Even weeks run (2026-12-07, 2026-12-21, ...). A run started by hand always goes on.
          week=$(( $(date -u +%s) / 604800 ))
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ $(( week % 2 )) -eq 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Week $week is an odd week: nothing to do until next Monday."
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.due.outputs.run == 'true'

      - name: Rebuild the skill from its source
        if: steps.due.outputs.run == 'true'
        id: update
        run: |
          set +e
          python3 scripts/sync_upstream_skills.py update --schedule biweekly \
            --report "$RUNNER_TEMP/sync-report.md" > "$RUNNER_TEMP/sync.log" 2>&1
          rc=$?
          cat "$RUNNER_TEMP/sync.log"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the rebuilt skill
        if: steps.due.outputs.run == 'true' && steps.update.outputs.changed == 'true'
        run: |
          python3 scripts/sync_upstream_skills.py verify
          bash tests/run-all.sh upstream
          bash tests/run-all.sh 'aws-diagram-design$'

      - name: Push the branch and ask for a review
        if: steps.due.outputs.run == 'true' && steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ runner.temp }}/sync-report.md
        run: |
          set -euo pipefail
          branch=sync/aws-diagram-design
          title="Sync aws-diagram-design with its source"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add -A
          git commit -q -m "feat: sync aws-diagram-design with its source"
          git push --force origin "$branch"
          number=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" --body-file "$REPORT"
          elif ! gh pr create --base "$GITHUB_REF_NAME" --head "$branch" --title "$title" --body-file "$REPORT"; then
            # The repository does not let Actions open pull requests: leave an issue with the link
            {
              cat "$REPORT"
              printf '\nOpen the pull request: %s/%s/compare/%s...%s?expand=1\n' \
                "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$branch"
            } > "$RUNNER_TEMP/issue.md"
            issue=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
            if [ -n "$issue" ]; then
              gh issue comment "$issue" --body-file "$RUNNER_TEMP/issue.md"
            else
              gh issue create --title "$title" --body-file "$RUNNER_TEMP/issue.md"
            fi
          fi

      - name: Say why the recipe did not apply
        if: steps.due.outputs.run == 'true' && steps.update.outputs.rc != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="aws-diagram-design: the sync recipe needs a change"
          {
            printf 'The source changed in a way the recipe does not cover, so nothing was written.\n'
            printf 'Fix `scripts/upstream/aws-diagram-design/recipe.json`, then run the update by hand:\n'
            printf '`docs/runbooks/sync-upstream-skills.md`.\n\n```text\n'
            # The log quotes text of the source: no backtick may close the block and no @ may notify anyone
            grep -E '^(REFUSED|UPDATED|OK|WARN|  NOTE) ' "$RUNNER_TEMP/sync.log" | tr '`@' "'." | cut -c1-1500 | head -40 || true
            printf '```\n'
          } > "$RUNNER_TEMP/failure.md"
          issue=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body-file "$RUNNER_TEMP/failure.md"
          else
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/failure.md"
          fi
          exit 1
